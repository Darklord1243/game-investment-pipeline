name: Weekly ETL & ML Pipeline

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed database & mine Steam data
        env:
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/data_collection/steam_data_miner.py

      - name: Mine Twitch data
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/data_collection/twitch_miner.py

      - name: Mine YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/data_collection/youtube_data_miner.py

      - name: Mine Reddit data
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/data_collection/reddit_data_miner.py

      - name: Train models
        env:
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/models/model_trainer.py

      - name: Commit and push updated artifacts
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated weekly pipeline run"
          file_pattern: "data/game_metrics.db enhanced_model_artifacts.pkl"
