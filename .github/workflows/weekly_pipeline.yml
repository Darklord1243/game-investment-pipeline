name: Weekly ETL & ML Pipeline

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-requests

      - name: Run MyPy (strict — blocks pipeline on failure)
        run: python -m mypy src/

  pipeline:
    needs: static-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed database & mine Steam data
        env:
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/data_collection/steam_data_miner.py

      - name: Mine Twitch data
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/data_collection/twitch_miner.py

      - name: Mine YouTube data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/data_collection/youtube_data_miner.py

      - name: Mine Reddit data
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/data_collection/reddit_data_miner.py

      - name: Train models
        env:
          DATABASE_URL: sqlite:///data/game_metrics.db
        run: python src/models/model_trainer.py

      - name: Set timestamp for artifacts
        id: ts
        run: echo "stamp=$(date +%Y-%m-%d-%H%M)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Push game_metrics.db to S3
        run: |
          aws s3 cp data/game_metrics.db \
            "s3://${{ secrets.AWS_S3_BUCKET }}/game-metrics/${{ steps.ts.outputs.stamp }}/game_metrics.db"

      - name: Publish model artifact to GitHub Releases (model registry)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "model-${{ steps.ts.outputs.stamp }}"
          name: "Model Release — ${{ steps.ts.outputs.stamp }}"
          body: |
            Automated model artifact from the weekly ETL + ML pipeline.

            **Best model:** see `deployment_summary.json` in the attached archive.
          files: |
            enhanced_model_artifacts.pkl
            deployment_summary.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
